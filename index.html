<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ─── SEO Foundation ─────────────────────────────────────────────────── -->
    <title>AVELIS | The Discerning Bibliophile's Sanctuary</title>
    <meta name="description" content="AVELIS is a premium digital library experience combining curated collections, intelligent discovery, reading journals, and immersive digital reading." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://avelis-alpha.vercel.app/" />
    <meta name="theme-color" content="#C9A227" />

    <!-- ─── Open Graph ─────────────────────────────────────────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AVELIS" />
    <meta property="og:title" content="AVELIS | The Discerning Bibliophile's Sanctuary" />
    <meta property="og:description" content="AVELIS is a premium digital library experience combining curated collections, intelligent discovery, reading journals, and immersive digital reading." />
    <meta property="og:url" content="https://avelis-alpha.vercel.app/" />
    <meta property="og:image" content="https://avelis-alpha.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AVELIS — The Discerning Bibliophile's Sanctuary" />

    <!-- ─── Twitter Card ───────────────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AVELIS | The Discerning Bibliophile's Sanctuary" />
    <meta name="twitter:description" content="AVELIS is a premium digital library experience combining curated collections, intelligent discovery, reading journals, and immersive digital reading." />
    <meta name="twitter:image" content="https://avelis-alpha.vercel.app/og-image.jpg" />

    <!-- Google Fonts & Material Symbols - Non-Blocking Preload Strategy -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Group 1: Text Fonts (Cinzel & Inter) -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap"
      onload="this.rel='stylesheet'"
    />
    
    <!-- Group 2: Icon Font (Material Symbols Outlined) -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL,wght,GRAD,opsz@0..1,400,0,20&display=swap"
      onload="this.rel='stylesheet'"
    />
    
    <!-- Fallback for JavaScript-Disabled Environments -->
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&family=Material+Symbols+Outlined:FILL,wght,GRAD,opsz@0..1,400,0,20&display=swap" />
    </noscript>
    

    <!--
      Preload the self-hosted Spline scene so the browser starts fetching
      the 987 KB binary during HTML parse — before React mounts and before
      the Spline component's requestIdleCallback fires. This eliminates the
      largest single network waterfall in the LCP path.

      as="fetch" + crossorigin="" tells the browser this is an XHR/fetch
      resource (not a script or style), matching how the Spline runtime
      fetches it internally. Without crossorigin the preloaded response
      would be discarded and re-fetched — defeating the purpose.
    -->
    <link
      rel="preload"
      href="/spline/scene.splinecode"
      as="fetch"
      crossorigin=""
    />

  </head>
  <body>
    <div id="root"></div>
    <div class="noise-overlay"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
